name: Documentation
description: Report an error or a gap in the documentation.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The link to the page or the path of the file.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the text, and say what is wrong or missing.
    validations:
      required: true
