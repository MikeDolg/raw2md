name: Smoke

# It installs the tool as a user does, with CPU torch. A dependency release
# breaks it more often than a commit does, hence the weekly run; a push runs it
# only when the installed code or the smoke itself changes. The release calls
# it on the wheel it built.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/smoke.yml'
      - '.github/scripts/**'
      - 'tests/synthesis/gen_smoke.py'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      wheel-artifact:
        # Empty installs the checkout instead.
        description: Name of the artifact that holds the wheel to install
        type: string
        default: ''

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    # `uv tool install` reads no lock file, so a dependency upgrade breaks a
    # user here first. DOCX converts in a second without a GPU or models.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Ensure pandoc
        # The docx target needs pandoc 3.1.9+; the Ubuntu 24.04 package is
        # 3.1.3, so a pinned release is installed instead.
        env:
          PANDOC_VERSION: 3.10.1
        run: |
          case "$RUNNER_OS" in
            Linux)
              case "$RUNNER_ARCH" in
                X64) arch=amd64 ;;
                ARM64) arch=arm64 ;;
                *) echo "no pandoc release asset for $RUNNER_ARCH" >&2; exit 1 ;;
              esac
              curl -fsSL -o pandoc.deb \
                "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-${arch}.deb"
              sudo dpkg -i pandoc.deb || (sudo apt-get update -qq && sudo apt-get install -f -y)
              rm pandoc.deb
              ;;
            Windows)
              choco install pandoc -y --no-progress --version="$PANDOC_VERSION"
              echo "C:/Program Files/Pandoc" >> "$GITHUB_PATH"
              ;;
            *) echo "no pandoc recipe for $RUNNER_OS" >&2; exit 1 ;;
          esac
          pandoc --version | head -1

      - if: inputs.wheel-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.wheel-artifact }}
          path: dist

      - name: Install raw2md the way a user does
        # The project pins the CUDA build of torch on x64, and the pin wins
        # over --torch-backend; --no-sources drops it, as a wheel install has
        # no pin either.
        env:
          WHEEL_ARTIFACT: ${{ inputs.wheel-artifact }}
        run: |
          if [ -n "$WHEEL_ARTIFACT" ]; then
            uv tool install dist/*.whl --torch-backend cpu
          else
            uv tool install . --no-sources --torch-backend cpu
          fi
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - run: raw2md --version

      - name: Report readiness
        run: |
          set +e
          raw2md doctor
          code=$?
          set -e
          # 3 is expected on a bare runner (no djvu chain, no API key); any
          # other nonzero code is a real failure.
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            exit "$code"
          fi

      - name: Convert a DOCX end to end
        run: |
          uv run --no-project --with pymupdf python tests/synthesis/gen_smoke.py docx smoke.docx
          raw2md smoke.docx --output-dir out

      - name: Check the result
        run: bash .github/scripts/check-smoke-result.sh out/smoke.md

  pdf:
    # marker on a CPU runner, one platform only: gigabytes of models and
    # minutes of inference. Proves the required engine runs without a GPU.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      # marker's model cache; bump the key suffix to refresh it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/datalab
          key: datalab-models-${{ runner.os }}-v1

      - if: inputs.wheel-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.wheel-artifact }}
          path: dist

      - name: Install raw2md the way a user does
        # The project pins the CUDA build of torch on x64, and the pin wins
        # over --torch-backend; --no-sources drops it, as a wheel install has
        # no pin either.
        env:
          WHEEL_ARTIFACT: ${{ inputs.wheel-artifact }}
        run: |
          if [ -n "$WHEEL_ARTIFACT" ]; then
            uv tool install dist/*.whl --torch-backend cpu
          else
            uv tool install . --no-sources --torch-backend cpu
          fi
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Convert a one-page PDF without a GPU
        run: |
          uv run --no-project --with pymupdf python tests/synthesis/gen_smoke.py pdf smoke.pdf
          raw2md smoke.pdf --cuda off --output-dir out

      - name: Check the result
        run: bash .github/scripts/check-smoke-result.sh out/smoke.md

      # The stage counters live only in the run log.
      - if: always()
        run: cp ~/.raw2md/logs/raw2md.log ./pdf-smoke.log || true

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-smoke-log
          path: pdf-smoke.log
          if-no-files-found: warn
