name: CI

on:
  # No test reads these paths, and docs.yml lints the Markdown. A run holds
  # four runners for minutes, and the next push queues behind it.
  # tests/corpus/ Markdown is absent on purpose: the fast layer reads it. A
  # new top-level folder joins the list only if no test reads it. The list is
  # written twice: GitHub Actions does not resolve YAML anchors.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    # Python versions fan out on fast Linux jobs, from the floor to the
    # ceiling in pyproject.toml. One Windows job, the slowest of the set, runs
    # the tests for the OS-specific behavior (the lock, the temp root, paths).
    # The linters and the coverage report run once.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
            lint: true
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-2025
            python: "3.12"
    runs-on: ${{ matrix.os }}
    # id-token lets the Codecov upload authenticate through OIDC instead of a
    # repository secret. Permissions are per job, not per matrix entry, so the
    # entries without coverage hold it too; none of them uses it.
    permissions:
      contents: read
      id-token: write
    env:
      # The fast layer never imports torch, so the multi-GB wheel and its
      # Linux-only CUDA and triton dependencies are skipped below; each is
      # reachable in uv.lock only through torch. A new one after a torch
      # upgrade only slows the job. UV_NO_SYNC stops `uv run` re-syncing them.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: >-
          uv sync --locked
          --no-install-package torch
          --no-install-package cuda-bindings
          --no-install-package cuda-pathfinder
          --no-install-package cuda-toolkit
          --no-install-package nvidia-cublas
          --no-install-package nvidia-cuda-cupti
          --no-install-package nvidia-cuda-nvrtc
          --no-install-package nvidia-cuda-runtime
          --no-install-package nvidia-cudnn-cu13
          --no-install-package nvidia-cufft
          --no-install-package nvidia-cufile
          --no-install-package nvidia-curand
          --no-install-package nvidia-cusolver
          --no-install-package nvidia-cusparse
          --no-install-package nvidia-cusparselt-cu13
          --no-install-package nvidia-nccl-cu13
          --no-install-package nvidia-nvjitlink
          --no-install-package nvidia-nvshmem-cu13
          --no-install-package nvidia-nvtx
          --no-install-package triton

      - if: matrix.lint
        run: uv run ruff format --check .
      - if: matrix.lint
        run: uv run ruff check .
      - if: matrix.lint
        run: uv run mypy

      - if: ${{ !matrix.lint }}
        run: uv run pytest

      - if: matrix.lint
        run: uv run pytest --cov --cov-report=xml
      - if: matrix.lint
        run: uv run coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"
      - if: matrix.lint
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true

      # Opt-in locally, but seconds long, and the lock is OS-specific: every
      # job runs it as a step of its own rather than a job billed separately.
      - run: uv run pytest -m concurrency
