name: CI

on:
  # No test reads these paths, and docs.yml lints them. Each job bills at
  # least a minute, Windows at twice the rate. tests/corpus/ Markdown is
  # absent on purpose: the fast layer reads it. The list is written twice:
  # GitHub Actions does not resolve YAML anchors.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    # Python versions fan out on cheap Linux jobs, from the floor to the
    # ceiling in pyproject.toml. One Windows job, billed double, runs the tests
    # for the OS-specific behavior (the lock, the temp root, paths). The
    # linters run once.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
            lint: true
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      # The fast layer never imports torch, so the multi-GB wheel and its
      # Linux-only CUDA and triton dependencies are skipped below; each is
      # reachable in uv.lock only through torch. A new one after a torch
      # upgrade only slows the job. UV_NO_SYNC stops `uv run` re-syncing them.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: >-
          uv sync --locked
          --no-install-package torch
          --no-install-package cuda-bindings
          --no-install-package cuda-pathfinder
          --no-install-package cuda-toolkit
          --no-install-package nvidia-cublas
          --no-install-package nvidia-cuda-cupti
          --no-install-package nvidia-cuda-nvrtc
          --no-install-package nvidia-cuda-runtime
          --no-install-package nvidia-cudnn-cu13
          --no-install-package nvidia-cufft
          --no-install-package nvidia-cufile
          --no-install-package nvidia-curand
          --no-install-package nvidia-cusolver
          --no-install-package nvidia-cusparse
          --no-install-package nvidia-cusparselt-cu13
          --no-install-package nvidia-nccl-cu13
          --no-install-package nvidia-nvjitlink
          --no-install-package nvidia-nvshmem-cu13
          --no-install-package nvidia-nvtx
          --no-install-package triton

      - if: matrix.lint
        run: uv run ruff format --check .
      - if: matrix.lint
        run: uv run ruff check .
      - if: matrix.lint
        run: uv run mypy

      - run: uv run pytest
