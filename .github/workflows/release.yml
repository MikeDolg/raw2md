name: Release

# A pushed v* tag builds once, smoke-tests the built wheel, uploads to PyPI
# and then makes the GitHub release, so a failed upload leaves no release.
# Last, it starts the deploy of the site. A
# manual run is the dry run: build and smoke only. A manual run on a tag also
# extracts the release notes, which shows that the annotation reaches the
# runner.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.12"

      - name: Check the tag against the package version
        if: github.event_name == 'push'
        run: |
          version=$(uv run --no-project python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

      - name: Extract the release notes from the tag
        # The checkout may store the tag without its annotation, so the tag is
        # fetched again as it is on the remote.
        if: github.ref_type == 'tag'
        run: |
          git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]; then
            echo "tag $GITHUB_REF_NAME is not annotated; the release text comes from its message" >&2
            exit 1
          fi
          mkdir notes
          git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' \
            "refs/tags/$GITHUB_REF_NAME" > notes/notes.md
          cat notes/notes.md >> "$GITHUB_STEP_SUMMARY"

      # --no-sources builds what PyPI users get: without the CUDA torch pin.
      - run: uv build --no-sources
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes/notes.md
          if-no-files-found: error

  smoke:
    needs: build
    uses: ./.github/workflows/smoke.yml
    with:
      wheel-artifact: dist

  pypi:
    needs: smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the manual approval and admits v* tags only.
    environment:
      name: pypi
      url: https://pypi.org/project/raw2md/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: notes

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes-file notes/notes.md
          --verify-tag

  # The site at raw2md.com shows the release that PyPI serves, so a new
  # release starts its deploy. A fork has no token: the release then stands
  # and the job only warns.
  site:
    needs: github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Start the deploy of the site
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set; the site is not deployed"
            exit 0
          fi
          gh api repos/MikeDolg/raw2md-site/dispatches -f event_type=raw2md-release
