# Categories of the generated release notes: one for each issue form label,
# and one for security fixes, which have no issue form.
# The catch-all keeps a pull request without a known label in the notes.
changelog:
  categories:
    - title: Security
      labels: [security]
    - title: Bug fixes
      labels: [bug]
    - title: Conversion quality
      labels: [quality]
    - title: Features
      labels: [enhancement]
    - title: Documentation
      labels: [documentation]
    - title: Maintenance
      labels: [task]
    - title: Other changes
      labels: ["*"]
